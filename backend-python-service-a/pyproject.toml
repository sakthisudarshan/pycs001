[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "backend-python-service-a"
version = "1.0.0"
description = "CE Platform — Python Service A (FastAPI + gRPC + MongoDB)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "grpcio==1.63.0",
    "grpcio-tools==1.63.0",
    "pymongo==4.7.2",
    "bson==0.5.10",
    "pydantic==2.7.1",
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "coverage>=7.4.0",
    "httpx==0.27.0",
    "mutmut==2.4.4",
    "cosmic-ray==8.3.7",
    "beniget==0.4.2",
    "pyflakes==3.2.0",
    "bandit==1.7.8",
    "copydetect==0.4.1",
    "pydriller==2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep default pytest lightweight so tools like testmon can run without pytest-cov installed.
# Coverage flags live in quality/coverage/pytest-cov.ini and run_coverage.sh.
addopts = "-v"

[tool.coverage.run]
branch = true
source = ["src", "analysis"]
omit = ["tests/*", "src/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def serve",
]

[tool.mutmut]
paths_to_mutate = "analysis/,src/"
tests_dir = "tests/"
runner = "python -m pytest"
