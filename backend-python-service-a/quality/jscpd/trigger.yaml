tool: jscpd
version: "4.0.0"
language: python
language_version: "3.11"
technique: Code Duplication Detection
classification: Code Duplication
target_files:
  - clone_a.py
  - clone_b.py
run:
  command: "python trigger.py"
run_command: python quality/jscpd/trigger.py
thresholds:
  min_lines: 5
  min_tokens: 40
  threshold: 5
expects:
  - duplicate_clone_detected: true
metric: Structural Cleanliness Score
primary: true
reporters:
  - console
  - json
output: quality/jscpd/report/
