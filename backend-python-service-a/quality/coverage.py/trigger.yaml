tool: coverage.py
version: "7.4.4"
language: python
language_version: "3.11"
technique: Code Coverage Auditing
classification: Statement and Branch Coverage
target_files:
  - sample_covered.py
  - test_sample_covered.py
run:
  command: "python trigger.py"
run_command: python quality/coverage.py/trigger.py
thresholds:
  statement: 80
  branch: 75
  fail_under: 80
metrics:
  - Statement Coverage %
  - Branch Coverage %
  - Path Coverage %
  - Coverage Delta %
primary: true
secondary: pytest-cov
reporters:
  - term-missing
  - xml
  - html
output: quality/coverage.py/report/
